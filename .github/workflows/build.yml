name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: test + assembleDebug + lintDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check for PII in log statements
        run: |
          # Payment-critical code must never interpolate raw SMS bodies or
          # full identifiers into logcat. Catches reintroductions at CI time.
          ! grep -rnE 'Log\.[dwie]\(.*\$\{?(body|rawMessage|messageBody)' \
            app/src/main/java/com/flowpay/app/{payment,receivers,services,helpers}/ \
            || (echo "::error::Log statement leaks SMS body content" && exit 1)

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Lint baseline must not grow
        run: |
          # The baseline freezes PRE-EXISTING lint debt. New code must fix
          # its lint findings, not absorb them into the baseline.
          ISSUES=$(grep -c "<issue" app/lint-baseline.xml || echo 0)
          echo "Baseline currently absorbs $ISSUES issues"
          if [ "$ISSUES" -gt 400 ]; then
            echo "::error::lint-baseline.xml grew beyond the frozen budget (400). Fix new lint issues instead of re-baselining."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload unit test reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
