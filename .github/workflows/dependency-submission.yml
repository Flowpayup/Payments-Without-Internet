name: Dependency submission

# GitHub's dependency graph does not detect Gradle dependencies statically —
# they only appear if a build submits them. Without this workflow the
# dependency-review gate on PRs sees zero dependency changes and passes
# unconditionally, and Dependabot cannot open alerts for Gradle CVEs.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
