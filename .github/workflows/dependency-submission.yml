name: Dependency submission

# GitHub's dependency graph does not detect Gradle dependencies statically —
# they only appear if a build submits them. Without this workflow the
# dependency-review gate on PRs sees zero dependency changes and passes
# unconditionally, and Dependabot cannot open alerts for Gradle CVEs.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
