name: Instrumented tests

# Emulator jobs are slow and occasionally flaky, so this does NOT run on every
# push. It runs when database code changes (Room migrations are the main
# on-device risk), on a weekly cron, and on demand.

on:
  pull_request:
    paths:
      - "app/src/main/java/com/flowpay/app/data/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    name: connectedDebugAndroidTest (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk and targetSdk — the two ends of the support window.
        api-level: [29, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
